name: Package Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release (e.g., 1.0.0)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build:prod

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Create distribution directory
        run: |
          mkdir -p dist/vip-agentforce
          
          # Copy all files except those in .distignore
          rsync -av --exclude-from='.distignore' ./ dist/vip-agentforce/
          
          # Remove .distignore from the distribution
          rm -f dist/vip-agentforce/.distignore

      - name: Create zip archive
        run: |
          cd dist
          zip -r vip-agentforce-${{ steps.version.outputs.version }}.zip vip-agentforce

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vip-agentforce-${{ steps.version.outputs.version }}
          path: dist/vip-agentforce-${{ steps.version.outputs.version }}.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vip-agentforce-${{ steps.version.outputs.version }}.zip
