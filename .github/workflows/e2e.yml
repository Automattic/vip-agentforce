name: Run e2e tests
on:
  pull_request:
  workflow_dispatch:
    inputs:
      wpversion:
        description: 'WordPress version to run tests against'
        required: false
        default: 'latest'
      url:
        description: 'Alternative Test URL'
        required: false
        default: ''
      user:
        description: 'Alternative User Name'
        required: false
        default: ''
      password:
        description: 'Alternative Password'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

jobs:
  Run_e2e_tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Check out repository code
        uses: actions/checkout@v5.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Install Playwright with Chromium
        timeout-minutes: 10
        run: |
          set -euo pipefail

          chromium_revision="$(node -p "require( './node_modules/playwright-core/browsers.json' ).browsers.find( ( browser ) => browser.name === 'chromium-headless-shell' ).revision")"
          ffmpeg_revision="$(node -p "require( './node_modules/playwright-core/browsers.json' ).browsers.find( ( browser ) => browser.name === 'ffmpeg' ).revision")"
          playwright_cache="${HOME}/.cache/ms-playwright"

          install_playwright_archive() {
            local url="$1"
            local target_dir="$2"
            local executable="$3"
            local archive

            archive="$(mktemp)"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 --output "${archive}" "${url}"
            rm -rf "${target_dir}"
            mkdir -p "${target_dir}"
            unzip -q "${archive}" -d "${target_dir}"
            rm -f "${archive}"
            chmod +x "${target_dir}/${executable}"
            touch "${target_dir}/INSTALLATION_COMPLETE" "${target_dir}/DEPENDENCIES_VALIDATED"
          }

          install_playwright_archive \
            "https://cdn.playwright.dev/dbazure/download/playwright/builds/chromium/${chromium_revision}/chromium-headless-shell-linux.zip" \
            "${playwright_cache}/chromium_headless_shell-${chromium_revision}" \
            "chrome-linux/headless_shell"

          install_playwright_archive \
            "https://cdn.playwright.dev/dbazure/download/playwright/builds/ffmpeg/${ffmpeg_revision}/ffmpeg-linux.zip" \
            "${playwright_cache}/ffmpeg-${ffmpeg_revision}" \
            "ffmpeg-linux"
        working-directory: tests/e2e

      - name: Install VIP CLI
        run: npm install -g @automattic/vip

      - name: Pin local dev-env hostname
        run: echo "127.0.0.1 e2e-agentforce-test-site.vipdev.lndo.site" | sudo tee -a /etc/hosts

      - name: Determine WP version
        run: |
          if [ -z "${{ github.event.inputs.wpversion }}" ]; then
            echo "WORDPRESS_VERSION=latest" >> $GITHUB_ENV
          else
            echo "WORDPRESS_VERSION=${{ github.event.inputs.wpversion }}" >> $GITHUB_ENV
          fi

      - name: Setup test env variables
        if: ${{ github.event.inputs.url != '' }}
        run: |
          echo "E2E_BASE_URL=${{ github.event.inputs.url }}" >> $GITHUB_ENV
          echo "E2E_USER=${{ github.event.inputs.user }}" >> $GITHUB_ENV
          echo "E2E_PASSWORD=${{ github.event.inputs.password }}" >> $GITHUB_ENV

      - name: Run e2e tests
        run: npm test
        working-directory: tests/e2e

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            tests/e2e/test-results
            tests/e2e/screenshots

  lint_e2e:
    name: Run ESLint on E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Check out repository code
        uses: actions/checkout@v5.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Run ESLint
        run: npm run lint
        working-directory: tests/e2e
